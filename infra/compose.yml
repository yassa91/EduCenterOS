name: educenteros-dev
services:
  postgres:
    image: ${EDUCENTEROS_POSTGRES_IMAGE:?Use the reviewed development launcher}
    environment:
      POSTGRES_USER: educenteros_admin
      POSTGRES_DB: educenteros_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets:
      - postgres_admin_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U educenteros_admin -d educenteros_dev"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
secrets:
  postgres_admin_password:
    file: ${EDUCENTEROS_POSTGRES_ADMIN_SECRET_FILE:?Use the reviewed development launcher}
volumes:
  postgres_data:
